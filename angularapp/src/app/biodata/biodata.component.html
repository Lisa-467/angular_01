<h3 class="text-center">BIODATA</h3>
<div class class="host">
  <form
    class="example-form"
    #registrationForm="ngForm"
    (ngSubmit)="onSubmit(registrationForm)"
  >
    <div>
      <mat-form-field class="example-full-width">
        <mat-label>First Name</mat-label>
        <input matInput ngModel name="firstName" [required]="true" />
      </mat-form-field>
    </div>
    <div>
      <mat-form-field class="example-full-width">
        <mat-label>Last Name</mat-label>
        <input matInput ngModel name="lastName" [required]="true" />
      </mat-form-field>
    </div>
    <div>
      <mat-form-field class="example-full-width">
        <mat-label>Date of Birth</mat-label>
        <input matInput ngModel name="dob" type="date" [required]="true" />
      </mat-form-field>
    </div>

    <div>
      <mat-form-field class="example-full-width">
        <mat-label>Email</mat-label>
        <input
          matInput
          email
          placeholder="Email"
          ngModel
          name="email"
          [required]="true"
        />
      </mat-form-field>
    </div>
    <div>
      <mat-form-field class="example-full-width">
        <mat-label>Pass out year</mat-label>
        <mat-select ngModel name="passOutYear">
          <mat-option value="2021">2021</mat-option>
          <mat-option value="2022">2022</mat-option>
          <mat-option value="2023">2023</mat-option>
          <mat-option value="2024">2024</mat-option>
          <mat-option value="2025">2025</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div>
      <mat-form-field class="example-full-width">
        <mat-label>Qualification</mat-label>
        <mat-select ngModel name="degree">
          <mat-option value="BCS">BCS</mat-option>
          <mat-option value="BCA">BCA</mat-option>
          <mat-option value="Btech">Btech</mat-option>
          <mat-option value="B.E">B.E</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div>
      <mat-form-field class="example-full-width">
        <mat-label>Mobile Number</mat-label>
        <input matInput ngModel name="mobileNumber" />
      </mat-form-field>
    </div>
    <div>
      <mat-form-field class="example-full-width">
        <mat-label>Address</mat-label>
        <input matInput ngModel name="address" />
      </mat-form-field>
    </div>
    <button
      mat-flat-button
      color="primary"
      [disabled]="!registrationForm.valid"
    >
      Submit
    </button>
  </form>
</div>
